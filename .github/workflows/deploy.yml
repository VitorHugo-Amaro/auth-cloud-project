name: Deploy to GCP
on: 
  push:
      branches: [main]
  pull_request:
      branches: [main]
jobs:

  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm install

      - name: Run Tests
        run: |
          cd backend
          npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }} 

  teste-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --run 

      - name: Build Check
        run: |
          cd frontend
          npm run build

  # --- NOVO JOB: BUILD E PUSH PARA DOCKER HUB ---
  docker-build-push:
    needs: [test-backend, teste-frontend] # Só roda se os testes passarem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/auth-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/auth-frontend:latest

  # --- NOVO JOB: DEPLOY NO GOOGLE CLOUD (SÃO PAULO) ---
  deploy-gcp:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_IP }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login no Docker no servidor (opcional se as imagens forem públicas)
            # 1. Parar containers antigos
            sudo docker stop auth-front auth-back || true
            sudo docker rm auth-front auth-back || true
            # 2. Baixar imagens novas
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/auth-frontend:latest
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/auth-backend:latest
            # 3. Rodar os novos containers
            sudo docker run -d --name auth-front -p 80:80 ${{ secrets.DOCKER_HUB_USERNAME }}/auth-frontend:latest
            sudo docker run -d --name auth-back -p 3000:3000 ${{ secrets.DOCKER_HUB_USERNAME }}/auth-backend:latest